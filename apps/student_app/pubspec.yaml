name: student_app
description: Digital Campus ID student app. Shows the rotating QR pass and the ID view.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  credential_core:
    path: ../../packages/credential_core
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  image_picker: ^1.1.2
  campus_ui:
    path: ../../packages/campus_ui
  google_mlkit_text_recognition: ^0.17.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pointycastle: ^3.9.1
flutter:
  uses-material-design: true
